name: Terraform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create SA Key file
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}' > /tmp/sa-key.json
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=/tmp/sa-key.json" >> $GITHUB_ENV

      # --- Backend (S3 bucket) ---
      - name: Terraform Init (backend)
        working-directory: 01-backend
        run: terraform init

      - name: Terraform Plan (backend)
        working-directory: 01-backend
        env:
          TF_VAR_state_bucket_name: ${{ secrets.YC_STATE_BUCKET }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
        run: terraform plan -out=tfplan-backend

      # --- Infrastructure (network, cluster, etc.) ---
      - name: Terraform Init (infra)
        working-directory: 02-infrastructure
        run: terraform init

      - name: Terraform Plan (infra)
        working-directory: 02-infrastructure
        env:
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
        run: terraform plan -out=tfplan-infra

      # --- Apply (only on manual trigger) ---
      - name: Terraform Apply (backend)
        if: github.event_name == 'workflow_dispatch'
        working-directory: 01-backend
        run: terraform apply tfplan-backend

      - name: Terraform Apply (infra)
        if: github.event_name == 'workflow_dispatch'
        working-directory: 02-infrastructure
        run: terraform apply tfplan-infra

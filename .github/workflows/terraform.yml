name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ---------------------------------------------------------
      # Шаг 1: Экспорт AWS ключей из GitHub Secrets
      # Это всё, что нужно для доступа к S3-бэкенду в Yandex Cloud
      # ---------------------------------------------------------
      - name: Set AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.YC_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.YC_SECRET_KEY }}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Шаг 2: Инициализация бэкенда (ТОЛЬКО init, без plan/apply)
      # ---------------------------------------------------------
      - name: Terraform Init (Backend)
        working-directory: diploma/01-backend
        run: |
          terraform init \
            -backend-config="bucket=diplom-tfstate-relekt" \
            -backend-config="key=backend/terraform.tfstate" \
            -backend-config="region=ru-central1" \
            -backend-config="endpoint=https://storage.yandexcloud.net" \
            -reconfigure

      # ---------------------------------------------------------
      # Шаг 3: Plan и Apply для реальной инфраструктуры
      # ---------------------------------------------------------
      - name: Terraform Plan (Infrastructure)
        working-directory: diploma/02-infrastructure
        run: terraform plan -out=tfplan

      - name: Terraform Apply (Infrastructure)
        working-directory: diploma/02-infrastructure
        run: terraform apply tfplan
